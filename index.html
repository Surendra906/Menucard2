<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Food Ordering System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="navbar">
    <div class="logo"><span>🍕</span> AppciRestaurant</div>
    <button class="cart-button" id="cart-button" type="button" aria-label="Open cart">
      Cart <span class="cart-count" id="cart-count">0</span>
    </button>
  </header>

  <main>
    <section class="hero">
      <p class="eyebrow">Freshly prepared • Fast delivery</p>
      <h1>What are you craving?</h1>
      <label class="search-box">
        <span aria-hidden="true">⌕</span>
        <input id="search-input" type="search" placeholder="Search the menu..." autocomplete="off">
      </label>
    </section>

    <div class="menu-heading">
      <h2>Popular dishes</h2>
      <span id="menu-count"></span>
    </div>
    <section id="menu-container" class="menu-grid" aria-live="polite"></section>
  </main>

  <aside class="cart-panel" id="cart-panel" aria-hidden="true">
    <div class="cart-header">
      <div><p class="eyebrow">Your order</p><h2>Cart</h2></div>
      <button class="close-button" id="close-cart" type="button" aria-label="Close cart">×</button>
    </div>
    <div class="cart-items" id="cart-items"></div>
    <div class="cart-footer">
      <div class="total-row"><span>Total</span><strong id="cart-total">$0.00</strong></div>
      <button class="checkout-button" id="checkout-button" type="button">Place order</button>
    </div>
  </aside>
  <div class="backdrop" id="backdrop"></div>

  <div class="toast" id="toast" role="status"></div>
  <script src="script.js"></script>
</body>
</html>
